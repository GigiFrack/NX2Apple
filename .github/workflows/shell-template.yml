name: shell template

# The Windows launcher does not compile the iOS shell: it takes a pre-built DmShell.app from the release
# archive and drops each game's framework inside it (tools/build_shell_template.py says why). A template
# built before the current engine therefore ships an old shell, and an old shell cannot read what a new
# engine writes — the DMMSLTR1 trailer on a RomFS image is exactly that case. This job builds a current
# one on macOS, so the launcher can be pointed at it (NSPB_SHELL_TEMPLATE, or the folder in the release).

# Two runs of the same branch would otherwise cancel each other in the queue (a cancelled run here is a
# fifteen-minute wait thrown away); this one waits its turn instead.
concurrency:
  group: shell-template-${{ github.ref }}
  cancel-in-progress: false

# Manual only: with the macOS runners queuing for fifteen minutes and then cancelling, a push-triggered
# run only burns the queue. Start it from the Actions tab when a macOS machine is free.
on:
  workflow_dispatch:

jobs:
  template:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Engine (upstream at the pin, plus this branch's patches)
        run: python3 tools/engine.py sync

      - name: xcodegen (tools/build_shell_template.py generates the project with it)
        run: brew install xcodegen

      # The shell uses iOS 27 APIs (UIHingeInteraction, reservedRegions): an older SDK fails with
      # "cannot find ... in scope" instead of saying the SDK is too old, so the newest Xcode wins.
      - name: Build the unsigned DmShell.app template
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p out
          {
            echo "== installed Xcodes =="
            ls -d /Applications/Xcode*.app 2>/dev/null
            xcodebuild -version
            xcodebuild -showsdks || true
          } | tee out/template-build.log
          best=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$best" ]; then sudo xcode-select -s "$best"; xcode-select -p; fi
          xcodebuild -version | tee -a out/template-build.log
          python3 tools/build_shell_template.py --engine engine --out out/DmShell.app 2>&1 | tee -a out/template-build.log

      - name: The template carries the shell's commit
        run: |
          cat out/DmShell.app/Info.plist | head -40 || true
          ls -la out/DmShell.app

      - name: Zip it
        run: cd out && ditto -c -k --sequesterRsrc --keepParent DmShell.app DmShell.app.zip && ls -lh DmShell.app.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DmShell-template
          path: |
            out/DmShell.app.zip
            out/template-build.log
          if-no-files-found: warn
