name: nextendo host checks

# Upstream runs its macOS jobs on a self-hosted runner labelled `xcode-27`, which exists only in that
# repository's infrastructure: on a fork those jobs queue for ever. This workflow runs the two host
# checks the Nextendo patches add, on a GitHub-hosted macOS runner, so a push to this branch is
# compiled and executed somewhere real before anyone installs an IPA.
on:
  push:
    branches: [nextendo]
    paths:
      - 'patches/**'
      - '.github/workflows/nextendo-host-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextendo-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    name: Host tests for the Nextendo patches
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Engine (seedds/nxnative at the pin, plus this branch's patches)
        run: python3 tools/engine.py sync

      - name: Build the host tests (the game profile is Mario Kart 8 Deluxe)
        run: |
          set -o pipefail          # `| tee` must not hide a failing make: a missing binary only shows up in the next step
          make -C engine/dm/host/tests GAME=0100152000022000 -j3 \
            build/t_nextendo_map build/t_nextendo_gai build/t_net_tcp build/t_net_udp_remote build/t_ssl_local build/t_ssl_certs \
            build/t_dauth_local build/t_nifm_nextendo build/t_idtoken build/t_npln_patch \
            build/t_net_loopback \
            2>&1 | tee host-tests-build.log

      - name: Run them
        run: |
          engine/dm/host/tests/build/t_nextendo_map
          engine/dm/host/tests/build/t_nextendo_gai
          engine/dm/host/tests/build/t_net_tcp
          engine/dm/host/tests/build/t_net_udp_remote
          engine/dm/host/tests/build/t_net_loopback
          engine/dm/host/tests/build/t_nifm_nextendo
          engine/dm/host/tests/build/t_idtoken
          engine/dm/host/tests/build/t_npln_patch
          engine/dm/host/tests/build/t_ssl_certs

      - name: The TLS connection, against a real server
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout /tmp/key.pem -out /tmp/cert.pem 2>/dev/null
          cat > /tmp/tls_echo.py <<'PY'
          import socket, ssl, sys
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain(sys.argv[2], sys.argv[3])
          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(('127.0.0.1', int(sys.argv[1])))
          s.listen(1)
          while True:                      # a port probe that only connects must not kill the server
              c, _ = s.accept()
              try:
                  with ctx.wrap_socket(c, server_side=True) as t:
                      data = t.recv(64)
                      t.sendall(data)
                  break
              except (ssl.SSLError, OSError):
                  c.close()
          PY
          python3 /tmp/tls_echo.py 8443 /tmp/cert.pem /tmp/key.pem &
          sleep 1
          DM_TEST_TLS_PORT=8443 engine/dm/host/tests/build/t_ssl_local

      - name: The dauth chain, against the mock
        run: |
          cat > /tmp/dauth_mock.py <<'PY'
          import http.server, ssl, sys, json
          class H(http.server.BaseHTTPRequestHandler):
              def _send(self, obj, code=200):
                  b = json.dumps(obj).encode()
                  self.send_response(code)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(b)))
                  self.end_headers()
                  self.wfile.write(b)
              def do_POST(self):
                  n = int(self.headers.get('Content-Length') or 0)
                  self.rfile.read(n)
                  p = self.path
                  if p == '/v8/challenge':
                      self._send({'challenge': 'AAAA', 'data': 'BBBB'})
                  elif p == '/v8/device_auth_tokens':
                      self._send({'results': [{'client_id': 'x', 'device_auth_token': 'dev-token', 'expires_in': 86400}]})
                  elif p == '/v8/edge_tokens':
                      self._send({'results': [{'client_id': 'x', 'vendor_id': '0', 'dtoken': 'edge-token', 'expires_in': 86400}]})
                  elif p == '/v5/application_auth_token':
                      self._send({'expires_in': 86400, 'application_auth_token': 'APP-TOKEN-42',
                                  'settings': [], 'online_play_policy': 'MEMBERSHIP_REQUIRED',
                                  'policy_handler': 'SYSTEM'})
                  else:
                      self._send({'error': 'nope'}, 404)
              def log_message(self, *a):
                  pass
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain(sys.argv[2], sys.argv[3])
          s = http.server.HTTPServer(('127.0.0.1', int(sys.argv[1])), H)
          s.socket = ctx.wrap_socket(s.socket, server_side=True)
          s.serve_forever()
          PY
          python3 /tmp/dauth_mock.py 8444 /tmp/cert.pem /tmp/key.pem &
          sleep 1
          DM_TEST_DAUTH_PORT=8444 engine/dm/host/tests/build/t_dauth_local

      - name: The iOS host still compiles for the iPhone SDK
        run: |
          cd engine
          python3 dm/ios/tools/compile_check.py 2>&1 | tail -20

      - name: Keep the logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextendo-host-logs
          path: |
            host-tests-build.log
            engine/logs/**
          if-no-files-found: ignore
